<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Quiz Blackjack — Triumph</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
<link rel="stylesheet" href="flappy.css" />
<link rel="stylesheet" href="blackjack.css" />
</head>
<body class="game-body">
<div class="game-topbar">
  <a href="index.html" class="secondary back-link" data-i18n="backLink"></a>
  <div id="deck-title" class="deck-title"></div>
  <div class="chip-badge">
    <span class="chip-badge-icon"></span>
    <span id="chips-display">0</span>
  </div>
  <div id="lang-switcher"></div>
</div>

<div class="bj-wrap">
  <div class="bj-table">
    <div class="bj-felt-ring"></div>

    <div class="bj-row bj-row-dealer">
      <div class="bj-label"><span data-i18n="dealerLabel"></span> <span id="dealer-total" class="bj-total"></span></div>
      <div id="dealer-cards" class="bj-cards"></div>
    </div>

    <p id="bj-message" class="bj-message"></p>

    <div class="bj-row bj-row-player">
      <div id="player-cards" class="bj-cards"></div>
      <div class="bj-label"><span data-i18n="playerLabel"></span> <span id="player-total" class="bj-total"></span></div>
    </div>
  </div>

  <div id="panel-betting" class="bj-panel">
    <p class="bj-panel-title" data-i18n="chooseBet"></p>
    <div id="bet-buttons" class="chip-rack"></div>
    <div class="bet-custom">
      <input type="number" id="bet-input" min="1" value="10" />
      <button id="deal-btn" data-i18n="dealBtn"></button>
    </div>
  </div>

  <div id="panel-playing" class="bj-panel bj-panel-round hidden">
    <button id="hit-btn" class="round-btn round-btn-hit" data-i18n="hitBtn"></button>
    <button id="double-btn" class="round-btn round-btn-double" data-i18n="doubleBtn"></button>
    <button id="stand-btn" class="round-btn round-btn-stand" data-i18n="standBtn"></button>
  </div>

  <div id="panel-resolved" class="bj-panel hidden">
    <p id="resolved-text"></p>
    <button id="continue-btn" data-i18n="continueBtn"></button>
  </div>

  <div id="overlay-question" class="overlay hidden">
    <p id="question-progress" class="question-progress"></p>
    <h3 id="question-text"></h3>
    <div id="question-options" class="question-options"></div>
    <p id="question-feedback" class="question-feedback"></p>
    <button id="next-question-btn" class="hidden" data-i18n="nextQuestionBtn"></button>
  </div>

  <div id="overlay-empty" class="overlay hidden">
    <h2 data-i18n="emptyDeckTitle"></h2>
    <p data-i18n="emptyDeckText"></p>
    <a href="index.html" class="secondary back-link" data-i18n="toHomepage"></a>
  </div>
</div>

<div class="watermark">by skoleelev18</div>

<script src="js/i18n.js"></script>
<script src="js/storage.js"></script>
<script src="js/blackjack.js"></script>
</body>
</html>
