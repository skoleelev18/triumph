<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Quiz Blackjack — PrøveSpill</title>
<link rel="stylesheet" href="style.css" />
<link rel="stylesheet" href="flappy.css" />
<link rel="stylesheet" href="blackjack.css" />
</head>
<body class="game-body">
<div class="game-topbar">
  <a href="index.html" class="secondary back-link">← Tilbake</a>
  <div id="deck-title" class="deck-title"></div>
  <div class="chip-badge">
    <span class="chip-badge-icon"></span>
    <span id="chips-display">0</span>
  </div>
</div>

<div class="bj-wrap">
  <div class="bj-table">
    <div class="bj-felt-ring"></div>

    <div class="bj-row bj-row-dealer">
      <div class="bj-label">Dealer <span id="dealer-total" class="bj-total"></span></div>
      <div id="dealer-cards" class="bj-cards"></div>
    </div>

    <p id="bj-message" class="bj-message"></p>

    <div class="bj-row bj-row-player">
      <div id="player-cards" class="bj-cards"></div>
      <div class="bj-label">Deg <span id="player-total" class="bj-total"></span></div>
    </div>
  </div>

  <div id="panel-betting" class="bj-panel">
    <p class="bj-panel-title">Velg innsats</p>
    <div id="bet-buttons" class="chip-rack"></div>
    <div class="bet-custom">
      <input type="number" id="bet-input" min="1" value="10" />
      <button id="deal-btn">Del ut kort</button>
    </div>
  </div>

  <div id="panel-playing" class="bj-panel bj-panel-round hidden">
    <button id="hit-btn" class="round-btn round-btn-hit">Hit</button>
    <button id="double-btn" class="round-btn round-btn-double">Double</button>
    <button id="stand-btn" class="round-btn round-btn-stand">Stand</button>
  </div>

  <div id="panel-resolved" class="bj-panel hidden">
    <p id="resolved-text"></p>
    <button id="continue-btn">Fortsett</button>
  </div>

  <div id="panel-broke" class="bj-panel hidden">
    <p>Du er blakk! Svar riktig på et spørsmål for å få litt startkapital.</p>
    <button id="bailout-btn">Få startkapital</button>
  </div>

  <div id="overlay-question" class="overlay hidden">
    <p id="question-progress" class="question-progress"></p>
    <h3 id="question-text"></h3>
    <div id="question-options" class="question-options"></div>
    <p id="question-feedback" class="question-feedback"></p>
  </div>

  <div id="overlay-empty" class="overlay hidden">
    <h2>Fant ikke temaet</h2>
    <p>Velg et tema med minst ett spørsmål på hjemmesiden.</p>
    <a href="index.html" class="secondary back-link">Til hjemmesiden</a>
  </div>
</div>

<script src="js/storage.js"></script>
<script src="js/blackjack.js"></script>
</body>
</html>
