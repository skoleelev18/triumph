<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Triumph</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
<header class="site-header">
  <div id="lang-switcher" class="lang-switcher"></div>
  <h1>🎮 Triumph</h1>
  <p class="tagline" data-i18n="appTagline"></p>
</header>

<main>
  <section class="card" id="decks-section">
    <h2 data-i18n="decksHeading"></h2>
    <div id="deck-list" class="deck-list"></div>

    <form id="new-deck-form" class="inline-form">
      <input type="text" id="new-deck-name" data-i18n-placeholder="newDeckPlaceholder" required />
      <button type="submit" data-i18n="newDeckBtn"></button>
    </form>

    <button id="import-file-btn" type="button" class="secondary" data-i18n="importFromFileBtn"></button>
    <input type="file" id="import-file-input" accept="application/json" class="hidden" />
    <p id="deck-import-status"></p>
  </section>

  <section class="card" id="manual-section">
    <h2 data-i18n="manualHeading"></h2>
    <form id="manual-question-form">
      <label>
        <span data-i18n="manualDeckLabel"></span>
        <select id="manual-deck-select" required></select>
      </label>
      <label>
        <span data-i18n="manualQuestionLabel"></span>
        <input type="text" id="manual-question-text" data-i18n-placeholder="manualQuestionPlaceholder" required />
      </label>
      <div class="options-grid">
        <label>
          <span data-i18n="optionALabel"></span>
          <input type="text" id="opt-0" required />
        </label>
        <label>
          <span data-i18n="optionBLabel"></span>
          <input type="text" id="opt-1" required />
        </label>
        <label>
          <span data-i18n="optionCLabel"></span>
          <input type="text" id="opt-2" required />
        </label>
        <label>
          <span data-i18n="optionDLabel"></span>
          <input type="text" id="opt-3" required />
        </label>
      </div>
      <fieldset class="correct-answer">
        <legend data-i18n="correctAnswerLegend"></legend>
        <label><input type="radio" name="correct" value="0" checked /> A</label>
        <label><input type="radio" name="correct" value="1" /> B</label>
        <label><input type="radio" name="correct" value="2" /> C</label>
        <label><input type="radio" name="correct" value="3" /> D</label>
      </fieldset>
      <button type="submit" data-i18n="addQuestionBtn"></button>
    </form>
  </section>

  <section class="card" id="ai-section">
    <h2 data-i18n="aiHeading"></h2>
    <p class="hint" data-i18n="aiHint"></p>
    <form id="ai-prompt-form">
      <label>
        <span data-i18n="aiTopicLabel"></span>
        <input type="text" id="ai-topic" data-i18n-placeholder="aiTopicPlaceholder" required />
      </label>
      <div class="options-grid">
        <label>
          <span data-i18n="aiCountLabel"></span>
          <input type="number" id="ai-count" min="1" max="20" value="5" required />
        </label>
        <label>
          <span data-i18n="aiLevelLabel"></span>
          <select id="ai-level">
            <option value="lett" data-i18n="aiLevelEasy"></option>
            <option value="middels" selected data-i18n="aiLevelMedium"></option>
            <option value="vanskelig" data-i18n="aiLevelHard"></option>
          </select>
        </label>
      </div>
      <label>
        <span data-i18n="aiContextLabel"></span>
        <textarea id="ai-context" rows="2" data-i18n-placeholder="aiContextPlaceholder"></textarea>
      </label>
      <button type="submit" data-i18n="aiMakePromptBtn"></button>
    </form>

    <div id="ai-prompt-result" class="hidden">
      <label>
        <span data-i18n="aiPromptOutputLabel"></span>
        <textarea id="ai-prompt-output" rows="8" readonly></textarea>
      </label>
      <button id="copy-prompt-btn" type="button" data-i18n="aiCopyBtn"></button>
    </div>

    <div id="ai-import-block">
      <label>
        <span data-i18n="aiResponseLabel"></span>
        <textarea id="ai-response-input" rows="8" data-i18n-placeholder="aiResponsePlaceholder"></textarea>
      </label>
      <label>
        <span data-i18n="aiImportDeckLabel"></span>
        <select id="ai-import-deck-select"></select>
      </label>
      <button id="import-questions-btn" type="button" data-i18n="aiImportBtn"></button>
      <p id="import-status"></p>
    </div>
  </section>
</main>

<footer class="site-footer">
  <p data-i18n="footerNote"></p>
  <p class="footer-credit">🕹️ Triumph — by skoleelev18</p>
</footer>

<script src="js/i18n.js"></script>
<script src="js/storage.js"></script>
<script src="js/ai-helper.js"></script>
<script src="js/share.js"></script>
<script src="js/main.js"></script>
</body>
</html>
