<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Flappy Quiz — Triumph</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
<link rel="stylesheet" href="flappy.css" />
</head>
<body class="game-body">
<div class="game-topbar">
  <a href="index.html" class="secondary back-link" data-i18n="backLink"></a>
  <div id="deck-title" class="deck-title"></div>
  <div class="score-line">
    <span data-i18n="pointsLabel"></span>: <span id="score-display">0</span> ·
    <span data-i18n="recordLabel"></span>: <span id="highscore-display">0</span>
  </div>
  <div id="lang-switcher"></div>
</div>

<div class="game-wrap">
  <canvas id="game-canvas" width="480" height="640"></canvas>

  <div id="overlay-start" class="overlay">
    <h2 data-i18n="flappyTitle"></h2>
    <p id="overlay-start-text" data-i18n="flappyIntro"></p>
    <p data-i18n="flappyIntro2"></p>
    <button id="start-btn" data-i18n="startGameBtn"></button>
  </div>

  <div id="overlay-question" class="overlay hidden">
    <h3 id="question-text"></h3>
    <div id="question-options" class="question-options"></div>
    <p id="question-feedback" class="question-feedback"></p>
  </div>

  <div id="overlay-gameover" class="overlay hidden">
    <h2 data-i18n="gameOverTitle"></h2>
    <p id="gameover-summary"></p>
    <button id="restart-btn" data-i18n="playAgainBtn"></button>
    <a href="index.html" class="secondary back-link" data-i18n="backToDecks"></a>
  </div>

  <div id="overlay-empty" class="overlay hidden">
    <h2 data-i18n="emptyDeckTitle"></h2>
    <p data-i18n="emptyDeckText"></p>
    <a href="index.html" class="secondary back-link" data-i18n="toHomepage"></a>
  </div>
</div>

<div class="watermark">by skoleelev18</div>

<script src="js/i18n.js"></script>
<script src="js/storage.js"></script>
<script src="js/flappy.js"></script>
</body>
</html>
